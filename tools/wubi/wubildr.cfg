# Configuration embarquée dans wubildr, via le mini-disque (grub-mkimage -m).
#
# ⚠ Elle n'est PAS passée à -c : ce que -c contient est exécuté par le parseur
# MINIMAL de grub, qui ne connaît ni les commentaires, ni `if`, ni `[`. Un
# chargeur construit ainsi tombe sur l'invite `grub>` sans rien démarrer.
# build-wubildr.sh vérifie ce point sur l'image produite.
#
# Un seul chargeur gère les DEUX phases, sans que Windows ait à mémoriser où
# l'on en est — c'est le principe repris de wubildr.cfg d'origine :
#
#   phase 2 : si /ubuntu/disks/root.disk existe ET contient déjà un grub.cfg,
#             le système est installé, on démarre dessus ;
#   phase 1 : sinon on démarre l'ISO posée sur le disque, en session live,
#             pour que l'installation puisse s'y dérouler.
#
# La partition est retrouvée par RECHERCHE DE FICHIER (search -f) et non par
# UUID : NTFS n'expose pas d'UUID exploitable par grub (search --fs-uuid échoue
# dessus, constaté à l'essai).

echo "wubildr @@STAMP@@"

set wubi_ok=false

# ---------------------------------------------------------------- phase 2
if search --no-floppy --file --set=hostdev /ubuntu/disks/root.disk; then
    if loopback lo ($hostdev)/ubuntu/disks/root.disk; then
        if [ -e (lo)/boot/grub/grub.cfg ]; then
            set root=(lo)
            set prefix=(lo)/boot/grub
            if configfile /boot/grub/grub.cfg; then
                set wubi_ok=true
            fi
        fi
    fi
fi

# ---------------------------------------------------------------- phase 1
# Le fichier ci-dessous est écrit par l'étape Windows : lui seul connaît le nom
# exact de l'ISO déposée.
if [ "${wubi_ok}" = "false" ]; then
    if search --no-floppy --file --set=isodev /ubuntu/install/wubi-install.cfg; then
        set root=($isodev)
        if configfile /ubuntu/install/wubi-install.cfg; then
            set wubi_ok=true
        fi
    fi
fi

# ---------------------------------------------------------------- échec
# On ne rend JAMAIS la main à l'invite `grub>` : un menu, même minimal, dit au
# moins ce qui s'est passé et laisse repartir.
#
# Et surtout on DIT CE QUE GRUB VOIT, sans rien demander à taper : `search` qui
# échoue ne distingue pas « partition invisible », « système de fichiers
# illisible » et « fichier absent ». Le balayage ci-dessous les sépare, en une
# ligne par partition lisible — les partitions muettes ne s'affichent pas.
if [ "${wubi_ok}" = "false" ]; then
    echo ""
    echo "  Impossible de demarrer Ubuntu : ni /ubuntu/disks/root.disk,"
    echo "  ni /ubuntu/install/wubi-install.cfg n'ont ete trouves."
    echo ""
    echo "  ---- DIAGNOSTIC : ce que grub voit ----"
    echo "  chargeur lu depuis : $cmdpath"
    echo ""
    echo "  peripheriques enumeres :"
    ls
    echo ""
    echo "  partitions lisibles :"
    for dev in (hd0,gpt1) (hd0,gpt2) (hd0,gpt3) (hd0,gpt4) (hd1,gpt1) (hd1,gpt2) (hd1,gpt3) (hd1,gpt4) (hd2,gpt1) (hd2,gpt2) (hd2,gpt3) (hd2,gpt4) (hd3,gpt1) (hd3,gpt2) (hd3,gpt3) (hd3,gpt4); do
        if [ -d $dev/ ]; then
            set fstype=?
            probe --set=fstype --fs $dev
            set etat="$fstype"
            if [ -d $dev/Windows ]; then set etat="$fstype   Windows"; fi
            if [ -d $dev/ubuntu ]; then set etat="$fstype   /ubuntu present"; fi
            if [ -e $dev/ubuntu/install/wubi-install.cfg ]; then set etat="$fstype   *** CFG TROUVE ***"; fi
            echo "    $dev   $etat"
        fi
    done
    echo ""
    echo "  Aucune ligne ci-dessus = grub ne lit aucune partition."
    echo "  CFG TROUVE ci-dessus = c'est search qui echoue, pas la lecture."
    echo ""
    echo "  Photographiez cet ecran. Touche C : ligne de commande grub."
    echo "  Menu dans 5 minutes, ou tout de suite en appuyant sur une touche."
    sleep --interruptible 300

    set timeout=-1
    set default=0

    menuentry "Reessayer" {
        configfile (memdisk)/wubildr.cfg
    }

    menuentry "Redemarrer l'ordinateur" {
        reboot
    }

    menuentry "Eteindre l'ordinateur" {
        halt
    }
fi
