# Configuration embarquée dans wubildr (grub-mkimage -c).
#
# Un seul chargeur gère les DEUX phases, sans que Windows ait à mémoriser où
# l'on en est — c'est le principe repris de wubildr.cfg d'origine :
#
#   phase 2 : si /ubuntu/disks/root.disk existe ET contient déjà un grub.cfg,
#             le système est installé, on démarre dessus ;
#   phase 1 : sinon on démarre l'ISO posée sur le disque, en session live,
#             pour que l'installation puisse s'y dérouler.
#
# La partition est retrouvée par RECHERCHE DE FICHIER (search -f) et non par
# UUID : NTFS n'expose pas d'UUID exploitable par grub (search --fs-uuid échoue
# dessus, constaté à l'essai).

set wubi_ok=false

# ---------------------------------------------------------------- phase 2
if search --no-floppy --file --set=hostdev /ubuntu/disks/root.disk; then
    if loopback lo ($hostdev)/ubuntu/disks/root.disk; then
        if [ -e (lo)/boot/grub/grub.cfg ]; then
            set root=(lo)
            set prefix=(lo)/boot/grub
            if configfile /boot/grub/grub.cfg; then
                set wubi_ok=true
            fi
        fi
    fi
fi

# ---------------------------------------------------------------- phase 1
# Le fichier ci-dessous est écrit par l'étape Windows : lui seul connaît le nom
# exact de l'ISO déposée.
if [ "${wubi_ok}" = "false" ]; then
    if search --no-floppy --file --set=isodev /ubuntu/install/wubi-install.cfg; then
        set root=($isodev)
        if configfile /ubuntu/install/wubi-install.cfg; then
            set wubi_ok=true
        fi
    fi
fi

# ---------------------------------------------------------------- échec
if [ "${wubi_ok}" = "false" ]; then
    echo ""
    echo "  Impossible de demarrer Ubuntu."
    echo ""
    echo "  Ni /ubuntu/disks/root.disk (systeme installe), ni"
    echo "  /ubuntu/install/wubi-install.cfg (support d'installation)"
    echo "  n'ont ete trouves sur les partitions visibles."
    echo ""
    echo "  Cause la plus frequente : le demarrage rapide de Windows laisse la"
    echo "  partition NTFS marquee comme occupee, et grub ne peut pas la lire."
    echo "  Sous Windows, en administrateur :  powercfg /h off"
    echo "  puis arret complet (et non mise en veille) avant de reessayer."
    echo ""
    echo "  Si le probleme persiste :  chkdsk C: /r"
    echo ""
    sleep --interruptible 60
fi
