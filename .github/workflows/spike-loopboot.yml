name: Spike - boot loop-monte 26.04

# Vérifie que le mécanisme Wubi (racine dans un fichier root.disk sur NTFS,
# monté par l'initramfs via loop=) fonctionne encore sur Ubuntu 26.04.
# Construit l'image puis la DEMARRE sous QEMU en UEFI et lit la console série.

on:
  # master doit rester identique a l'amont : le spike se declenche donc au
  # push sur sa propre branche (workflow_dispatch exigerait le fichier sur la
  # branche par defaut).
  push:
    branches: [ spike-loopboot-2604 ]
  workflow_dispatch:
    inputs:
      iso_url:
        description: "ISO à utiliser"
        required: false
        default: "https://releases.ubuntu.com/26.04/ubuntu-26.04-live-server-amd64.iso"

jobs:
  spike:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Espace disque et dépendances
        run: |
          df -h / /mnt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            squashfs-tools ntfs-3g gdisk dosfstools e2fsprogs rsync attr acl \
            qemu-system-x86 ovmf grub-efi-amd64-bin grub-common curl
          sudo mkdir -p /mnt/spike
          sudo chown $USER /mnt/spike

      - name: Construction de l'image (root.disk sur NTFS + grub EFI)
        env:
          ISO_URL: ${{ inputs.iso_url }}
          WORK: /mnt/spike
        run: |
          chmod +x tools/spike/build-loopboot.sh
          sudo -E tools/spike/build-loopboot.sh

      - name: Démarrage réel sous QEMU (UEFI)
        run: |
          cd /mnt/spike
          # OVMF : firmware UEFI. Les variables doivent être inscriptibles.
          CODE=$(ls /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd 2>/dev/null | head -1)
          VARS=$(ls /usr/share/OVMF/OVMF_VARS_4M.fd /usr/share/OVMF/OVMF_VARS.fd 2>/dev/null | head -1)
          echo "firmware : $CODE / $VARS"
          cp "$VARS" vars.fd

          # KVM si le runner l'expose, sinon émulation pure (plus lent mais suffisant)
          ACCEL=""
          if [ -w /dev/kvm ]; then ACCEL="-enable-kvm -cpu host"; echo "KVM disponible"
          else ACCEL="-cpu max"; echo "pas de KVM : émulation TCG"; fi

          : > serial.log
          sudo qemu-system-x86_64 \
            -machine q35 -m 3072 -smp 4 $ACCEL \
            -drive if=pflash,format=raw,readonly=on,file="$CODE" \
            -drive if=pflash,format=raw,file=vars.fd \
            -drive file=disk.img,format=raw,if=virtio \
            -net none -display none -monitor none \
            -serial file:serial.log &
          QPID=$!

          # On guette soit l'invite de connexion (succès), soit les signatures
          # d'échec connues de l'initramfs.
          VERDICT="timeout"
          for i in $(seq 1 210); do
            if grep -qE "spike login:|Welcome to Ubuntu" serial.log 2>/dev/null; then VERDICT="ok"; break; fi
            if grep -qE "Kernel panic|Dropping to a shell|ALERT!|does not exist" serial.log 2>/dev/null; then VERDICT="echec"; break; fi
            if ! kill -0 $QPID 2>/dev/null; then VERDICT="qemu-mort"; break; fi
            sleep 10
          done
          sudo kill $QPID 2>/dev/null || true
          sleep 2

          echo "=============== CONSOLE SERIE ==============="
          cat serial.log || true
          echo "============================================="
          echo "VERDICT : $VERDICT"
          test "$VERDICT" = "ok"

      - name: Journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-logs
          path: |
            /mnt/spike/serial.log
          if-no-files-found: ignore
