name: Spike - boot loop-monte 26.04

# Vérifie que le mécanisme Wubi (racine dans un fichier root.disk sur NTFS,
# monté par l'initramfs via loop=) fonctionne encore sur Ubuntu 26.04.
# Construit l'image puis la DEMARRE sous QEMU en UEFI et lit la console série.

on:
  # master doit rester identique a l'amont : le spike se declenche donc au
  # push sur sa propre branche (workflow_dispatch exigerait le fichier sur la
  # branche par defaut).
  push:
    branches: [ spike-loopboot-2604 ]
  workflow_dispatch:
    inputs:
      iso_url:
        description: "ISO à utiliser"
        required: false
        default: "https://releases.ubuntu.com/26.04/ubuntu-26.04-live-server-amd64.iso"

jobs:
  spike:
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4

      - name: Espace disque et dépendances
        run: |
          df -h / /mnt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            squashfs-tools ntfs-3g gdisk dosfstools e2fsprogs rsync attr acl \
            qemu-system-x86 ovmf grub-efi-amd64-bin grub-common curl
          sudo mkdir -p /mnt/spike
          sudo chown $USER /mnt/spike

      - name: Récupération de l'ISO
        env:
          ISO_URL: ${{ inputs.iso_url }}
        run: |
          URL="${ISO_URL:-https://releases.ubuntu.com/26.04/ubuntu-26.04-live-server-amd64.iso}"
          curl -L --retry 5 --retry-delay 5 -o /mnt/spike/image.iso "$URL"
          ls -lh /mnt/spike/image.iso

      # wubildr : la seule pièce qui doit être produite sous Linux
      # (grub-mkimage n'existe pas sous Windows). Publié en artefact, il n'y a
      # plus qu'à le copier sur la machine cible.
      - name: Construction de wubildr
        run: |
          bash tools/wubi/build-wubildr.sh /mnt/spike/grubx64.efi
          ls -l /mnt/spike/grubx64.efi
      # Paquet prêt à l'emploi : l'utilisateur final n'a besoin d'aucune machine
      # Linux pour préparer l'installation. Seule la FABRICATION du chargeur en
      # exige une, et elle a lieu ici, une fois.
      - name: Paquet Windows
        run: |
          KIT=/mnt/spike/wubi-windows-kit
          mkdir -p "$KIT"
          cp tools/wubi/Wubi-Gui.ps1 tools/wubi/Install-Wubi.ps1 tools/wubi/install-wubi.sh "$KIT/"
          cp /mnt/spike/grubx64.efi "$KIT/"
          cat > "$KIT/LISEZ-MOI.txt" << 'TXT'
          Installation d'Ubuntu aux côtés de Windows, sans repartitionner
          ==============================================================

          Ubuntu est installé dans un fichier posé sur votre partition Windows.
          Aucune partition n'est modifiée, et tout se désinstalle.

          CE QU'IL VOUS FAUT
            - ce dossier
            - une image ISO d'Ubuntu 26.04 ou plus récente (ubuntu.com)
            - environ 40 Go libres sur un disque en NTFS

          MARCHE À SUIVRE
            1. Clic droit sur Wubi-Gui.ps1 > Exécuter avec PowerShell
               (il demande les droits administrateur de lui-même)
            2. Choisir l'ISO, le disque, la taille, le compte. Valider.
            3. Redémarrer et choisir « Ubuntu (Wubi) » au démarrage.
            4. Dans la session Ubuntu qui s'ouvre, lancer l'installation :
                  sudo bash /cdrom/../install-wubi.sh
               (la commande exacte est rappelée à la fin de l'étape 1)
            5. Redémarrer : Ubuntu démarre depuis le fichier.

          POUR TOUT DÉFAIRE
              .\Install-Wubi.ps1 -Uninstall

          AVERTISSEMENTS
            - Le démarrage rapide de Windows doit rester désactivé. Sinon
              Windows s'hiberne au lieu de s'éteindre, la partition reste
              occupée, et Ubuntu ne démarre pas. L'interface le propose.
            - grubx64.efi n'est pas signé : si le Secure Boot est actif, il
              faut le désactiver, ou signer le chargeur et enrôler la clé.
          TXT
          (cd /mnt/spike && zip -r wubi-windows-kit.zip wubi-windows-kit >/dev/null)
          ls -l /mnt/spike/wubi-windows-kit.zip

      - name: Publication du paquet
        uses: actions/upload-artifact@v4
        with:
          name: wubi-windows-kit
          path: /mnt/spike/wubi-windows-kit.zip
          if-no-files-found: error

      - name: Préparation du disque de test (GPT + ESP + NTFS)
        env: { WORK: /mnt/spike }
        run: sudo -E bash tools/spike/prepare-disk.sh

      # C'est le VRAI installeur qui est mis à l'épreuve ici, celui destiné à
      # tourner depuis une session live sur la machine de l'utilisateur.
      - name: "INSTALLATION (tools/wubi/install-wubi.sh)"
        run: |
          . /mnt/spike/spike.env
          sudo bash tools/wubi/install-wubi.sh \
            --iso /mnt/spike/image.iso \
            --host "$MNT_HOST" \
            --esp "$MNT_ESP" \
            --size 9 --swap 0 \
            --user spike --password spike \
            --hostname spike \
            --locale en_US.UTF-8 --keyboard us --timezone UTC \
            --console-serial

      - name: Extraction du noyau pour le test direct
        run: |
          . /mnt/spike/spike.env
          sudo mkdir -p /mnt/spike/boot-direct
          sudo mount -o loop "$MNT_HOST/ubuntu/disks/root.disk" /mnt/spike/mnt/root 2>/dev/null \
            || { sudo mkdir -p /mnt/spike/mnt/root; sudo mount -o loop "$MNT_HOST/ubuntu/disks/root.disk" /mnt/spike/mnt/root; }
          K=$(sudo sh -c 'ls /mnt/spike/mnt/root/boot/vmlinuz-* | sort -V | tail -1')
          I=$(sudo sh -c 'ls /mnt/spike/mnt/root/boot/initrd.img-* | sort -V | tail -1')
          echo "noyau : $K"; echo "initrd : $I"
          sudo cp "$K" /mnt/spike/boot-direct/vmlinuz
          sudo cp "$I" /mnt/spike/boot-direct/initrd.img
          sudo umount /mnt/spike/mnt/root

      - name: Démontage du disque de test
        run: |
          . /mnt/spike/spike.env
          sync
          sudo umount "$MNT_ESP" "$MNT_HOST"
          sudo losetup -d "$LOOPDEV"
          echo "disque libéré, prêt pour QEMU"

      # ETAGE 1 : la vraie question du spike. On court-circuite firmware et
      # bootloader en donnant le noyau et l'initrd directement a QEMU. Si ca
      # demarre, le mecanisme Wubi (loop= sur une racine posee en NTFS) tient
      # toujours en 26.04, independamment de toute question UEFI.
      - name: "Étage 1 — démarrage direct du noyau (le pilier)"
        run: |
          cd /mnt/spike
          . ./spike.env
          echo "racine hote : PARTUUID=$HOST_PARTUUID   fichier : /ubuntu/disks/root.disk"
          ACCEL="-cpu max"; [ -w /dev/kvm ] && ACCEL="-enable-kvm -cpu host"
          : > direct-serial.log ; : > direct-qemu.log
          sudo qemu-system-x86_64 \
            -machine q35 -m 3072 -smp 4 $ACCEL \
            -kernel boot-direct/vmlinuz -initrd boot-direct/initrd.img \
            -append "root=PARTUUID=$HOST_PARTUUID rootfstype=ntfs3 loop=/ubuntu/disks/root.disk loopfstype=ext4 ro console=ttyS0,115200" \
            -drive file=disk.img,format=raw,if=virtio \
            -nic none -display none -no-reboot \
            -serial file:direct-serial.log > direct-qemu.log 2>&1 &
          QPID=$!
          sleep 5
          kill -0 $QPID 2>/dev/null || { echo "QEMU n'a pas demarre :"; cat direct-qemu.log; exit 1; }

          VERDICT="timeout"
          for i in $(seq 1 200); do
            # Succes = APRES le switch_root uniquement. "Reached target" seul est
            # un faux positif : l'initramfs en atteint plusieurs avant de monter
            # la vraie racine (piege du run precedent).
            grep -qE "spike login:|Reached target Multi-User|Startup finished in" direct-serial.log 2>/dev/null && { VERDICT="ok"; break; }
            grep -qE "Kernel panic|Dropping to a shell|ALERT!|unable to mount root|Entering emergency mode|Can.t find ext4|dracut-initqueue" direct-serial.log 2>/dev/null && { VERDICT="echec"; break; }
            kill -0 $QPID 2>/dev/null || { VERDICT="qemu-mort"; break; }
            sleep 10
          done
          sudo kill $QPID 2>/dev/null || true ; sleep 2
          echo "=============== SORTIE QEMU ==============="
          cat direct-qemu.log || true
          echo "=========== CONSOLE SERIE (NOYAU) ========="
          tail -120 direct-serial.log || true
          echo "==========================================="
          echo "VERDICT PILIER : $VERDICT"
          test "$VERDICT" = "ok"

      # ETAGE 2 : la chaine complete (OVMF -> grub -> loopback -> noyau).
      # Informatif : un echec ici n'invalide pas le pilier valide a l'etage 1.
      # QEMU est lance en tache de fond puis surveille par tranches, chacune
      # suivie d'un televersement : les artefacts sont recuperables RUN EN
      # COURS, alors que l'archive des journaux n'existe qu'a la fin du job.
      - name: "Étage 2 — lancement de QEMU (UEFI)"
        continue-on-error: true
        run: |
          cd /mnt/spike
          # OVMF : firmware UEFI. Les variables doivent être inscriptibles.
          CODE=$(ls /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd 2>/dev/null | head -1)
          VARS=$(ls /usr/share/OVMF/OVMF_VARS_4M.fd /usr/share/OVMF/OVMF_VARS.fd 2>/dev/null | head -1)
          echo "firmware : $CODE / $VARS"
          cp "$VARS" vars.fd

          # KVM si le runner l'expose, sinon émulation pure (plus lent mais suffisant)
          ACCEL=""
          if [ -w /dev/kvm ]; then ACCEL="-enable-kvm -cpu host"; echo "KVM disponible"
          else ACCEL="-cpu max"; echo "pas de KVM : émulation TCG"; fi

          rm -f verdict
          : > serial.log
          : > qemu.log
          # La sortie de QEMU lui-meme doit etre capturee : sans elle, un refus
          # de demarrage est indiscernable d'un noyau qui ne dit rien.
          sudo nohup qemu-system-x86_64 \
            -machine q35 -m 3072 -smp 4 $ACCEL \
            -drive if=pflash,format=raw,readonly=on,file="$CODE" \
            -drive if=pflash,format=raw,file=vars.fd \
            -drive file=disk.img,format=raw,if=virtio \
            -nic none -display none -no-reboot \
            -debugcon file:ovmf.log -global isa-debugcon.iobase=0x402 \
            -serial file:serial.log > qemu.log 2>&1 &
          echo $! > qemu.pid
          sleep 5
          if ! kill -0 $(cat qemu.pid) 2>/dev/null; then
            echo "QEMU n'a pas demarre. Sa sortie :"
            cat qemu.log
            echo qemu-mort > verdict
          else
            echo "QEMU lance (pid $(cat qemu.pid)), surveillance par tranches"
          fi

      - name: "Étage 2 — tranche 1"
        continue-on-error: true
        run: WORK=/mnt/spike bash tools/spike/checkpoint.sh 840
      - name: "Console apres tranche 1"
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: serial-t1, path: /mnt/spike/serial.log, if-no-files-found: ignore, overwrite: true }

      - name: "Étage 2 — tranche 2"
        continue-on-error: true
        run: WORK=/mnt/spike bash tools/spike/checkpoint.sh 840
      - name: "Console apres tranche 2"
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: serial-t2, path: /mnt/spike/serial.log, if-no-files-found: ignore, overwrite: true }

      - name: "Étage 2 — tranche 3"
        continue-on-error: true
        run: WORK=/mnt/spike bash tools/spike/checkpoint.sh 840
      - name: "Console apres tranche 3"
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: serial-t3, path: /mnt/spike/serial.log, if-no-files-found: ignore, overwrite: true }

      - name: "Étage 2 — tranche 4"
        continue-on-error: true
        run: WORK=/mnt/spike bash tools/spike/checkpoint.sh 840
      - name: "Console apres tranche 4"
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: serial-t4, path: /mnt/spike/serial.log, if-no-files-found: ignore, overwrite: true }

      - name: "Étage 2 — tranche 5"
        continue-on-error: true
        run: WORK=/mnt/spike bash tools/spike/checkpoint.sh 840
      - name: "Console apres tranche 5"
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: serial-t5, path: /mnt/spike/serial.log, if-no-files-found: ignore, overwrite: true }

      - name: "Étage 2 — verdict"
        continue-on-error: true
        run: |
          cd /mnt/spike
          sudo kill $(cat qemu.pid) 2>/dev/null || true
          sleep 2
          echo "=============== SORTIE QEMU ==============="
          cat qemu.log || true
          echo "=============== CONSOLE SERIE ==============="
          tr -d '\000' < serial.log || true
          echo "============================================="
          echo "VERDICT : $( [ -f verdict ] && cat verdict || echo timeout )"
          test "$( [ -f verdict ] && cat verdict )" = "ok"

      - name: Journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-logs
          path: |
            /mnt/spike/serial.log
            /mnt/spike/qemu.log
            /mnt/spike/ovmf.log
            /mnt/spike/direct-serial.log
            /mnt/spike/direct-qemu.log
          if-no-files-found: ignore

  # Vérifie la PHASE 1 : wubildr démarre-t-il l'ISO posée sur la partition
  # NTFS, sans clé USB ? Repose sur iso-scan/filename, dernière hypothèse non
  # testée de la chaîne.
  phase1-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ntfs-3g gdisk dosfstools qemu-system-x86 ovmf grub-efi-amd64-bin curl
          sudo mkdir -p /mnt/iso1 && sudo chown $USER /mnt/iso1

      - name: Récupération de l'ISO
        env:
          ISO_URL: ${{ inputs.iso_url }}
        run: |
          URL="${ISO_URL:-https://releases.ubuntu.com/26.04/ubuntu-26.04-live-server-amd64.iso}"
          curl -L --retry 5 -o /mnt/iso1/image.iso "$URL"
          ls -lh /mnt/iso1/image.iso

      - name: Disque avec ISO déposée (pas de root.disk)
        env: { WORK: /mnt/iso1, IMG_SIZE: 20G }
        run: |
          sudo -E bash tools/spike/prepare-disk.sh
          . /mnt/iso1/spike.env
          bash tools/wubi/build-wubildr.sh /mnt/iso1/grubx64.efi
          sudo mkdir -p "$MNT_HOST/ubuntu/install" "$MNT_ESP/EFI/wubildr"
          sudo cp /mnt/iso1/image.iso "$MNT_HOST/ubuntu/image.iso"
          sudo cp /mnt/iso1/grubx64.efi "$MNT_ESP/EFI/wubildr/grubx64.efi"
          sudo mkdir -p "$MNT_ESP/EFI/BOOT"
          sudo cp /mnt/iso1/grubx64.efi "$MNT_ESP/EFI/BOOT/BOOTX64.EFI"
          # Même contenu que celui écrit par Install-Wubi.ps1
          sudo tee "$MNT_HOST/ubuntu/install/wubi-install.cfg" > /dev/null << 'CFG'
          search --no-floppy --file --set=hostdev /ubuntu/install/wubi-install.cfg
          loopback iso ($hostdev)/ubuntu/image.iso
          set root=(iso)
          linux (iso)/casper/vmlinuz boot=casper iso-scan/filename=/ubuntu/image.iso ro console=ttyS0,115200
          initrd (iso)/casper/initrd
          boot
          CFG
          sync
          sudo umount "$MNT_ESP" "$MNT_HOST"
          sudo losetup -d "$LOOPDEV"

      - name: Démarrage de l'ISO depuis le disque (UEFI)
        run: |
          cd /mnt/iso1
          CODE=$(ls /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd 2>/dev/null | head -1)
          VARS=$(ls /usr/share/OVMF/OVMF_VARS_4M.fd /usr/share/OVMF/OVMF_VARS.fd 2>/dev/null | head -1)
          cp "$VARS" vars.fd
          ACCEL="-cpu max"; [ -w /dev/kvm ] && ACCEL="-enable-kvm -cpu host"
          : > serial.log
          sudo qemu-system-x86_64 -machine q35 -m 4096 -smp 4 $ACCEL \
            -drive if=pflash,format=raw,readonly=on,file="$CODE" \
            -drive if=pflash,format=raw,file=vars.fd \
            -drive file=disk.img,format=raw,if=virtio \
            -nic none -display none -no-reboot \
            -serial file:serial.log > qemu.log 2>&1 &
          QPID=$!
          VERDICT=timeout
          for i in $(seq 1 360); do
            grep -qE "ubuntu login:|Reached target Multi-User|Startup finished in|Welcome to Ubuntu" serial.log 2>/dev/null && { VERDICT=ok; break; }
            grep -qE "Kernel panic|Unable to find a medium|Dropping to a shell|ALERT!" serial.log 2>/dev/null && { VERDICT=echec; break; }
            kill -0 $QPID 2>/dev/null || { VERDICT=qemu-mort; break; }
            sleep 10
          done
          sudo kill $QPID 2>/dev/null || true; sleep 2
          echo "=============== CONSOLE ==============="
          tr -d '\000' < serial.log | tail -80 || true
          echo "======================================="
          echo "VERDICT PHASE 1 (iso-scan) : $VERDICT"
          test "$VERDICT" = ok

      - name: Journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-logs
          path: /mnt/iso1/serial.log
          if-no-files-found: ignore
